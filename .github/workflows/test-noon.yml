name: Test Noon Browser

on:
  workflow_dispatch:

jobs:
  test-noon:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Test Noon in Chromium
        run: |
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)

                  context = await browser.new_context(
                      locale="en-EG",
                      user_agent=(
                          "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                          "AppleWebKit/537.36 (KHTML, like Gecko) "
                          "Chrome/140.0.0.0 Safari/537.36"
                      )
                  )

                  page = await context.new_page()

                  response = await page.goto(
                      "https://www.noon.com/egypt-en/",
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  await page.wait_for_timeout(8000)

                  print("STATUS =", response.status if response else None)
                  print("TITLE =", await page.title())
                  print("URL =", page.url)

                  html = await page.content()
                  print("HTML_BYTES =", len(html.encode("utf-8")))

                  product_links = await page.locator(
                      'a[href*="/egypt-en/"]'
                  ).count()

                  print("LINKS =", product_links)

                  text = (await page.locator("body").inner_text())[:1000]
                  print("BODY_SAMPLE =", text.replace("\n", " ")[:1000])

                  if len(html) < 10000:
                      raise SystemExit("NOON_BROWSER_PAGE_TOO_SMALL")

                  await browser.close()

          asyncio.run(main())
          PY
